[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mandarin-reactor-api"
version = "0.3.0"
description = "Backend FastAPI para reproductor de video local de aprendizaje de mandarín (Fases 1, 2 y 3)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "sqlmodel>=0.0.16",
    "python-multipart>=0.0.9",
    "aiofiles>=23.2.1",
    "pydantic-settings>=2.2.1",
    "pysubs2>=1.7.0",
    "charset-normalizer>=3.3.2",
    "jieba==0.42.1",
    "pypinyin==0.55.0",
    "opencc-python-reimplemented>=0.1.7",
    "alembic>=1.13.0",
    "genanki>=0.13.0",
    "yt-dlp>=2024.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
filterwarnings = [
    "ignore:codecs\\.open\\(\\) is deprecated:DeprecationWarning:pypinyin.*",
    "ignore:'asyncio\\.iscoroutinefunction' is deprecated:DeprecationWarning:cached_property.*",
]
